* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; background: #07111f; }
.poster {
  width: 1080px; height: 1080px; position: relative; overflow: hidden;
  background: #07111f; color: #f7f4ec; font-family: "Outfit", sans-serif;
}
.logo-band {
  position: absolute; inset: 0; overflow: hidden;
}
.logo-band img {
  width: 1080px; height: 1240px; object-fit: cover; object-position: center 46%;
  display: block; margin-top: -150px;
}
.panel {
  position: absolute; left: 0; right: 0; bottom: 0; height: 448px;
  background: linear-gradient(180deg, rgba(7,17,31,0) 0%, #07111f 16%, #07111f 100%);
  padding: 58px 64px 40px;
  display: flex; flex-direction: column;
}
.kicker {
  font-family: "Montserrat", sans-serif; font-weight: 700;
  font-size: 15px; letter-spacing: 0.28em; text-transform: uppercase; color: #f0b429;
}
h1 {
  margin-top: 8px; font-weight: 600; font-size: 54px; line-height: 0.96;
  letter-spacing: -0.03em;
}
h1 em { font-style: normal; color: #f0b429; }
.deck {
  margin-top: 10px; font-size: 20px; line-height: 1.3; font-weight: 400;
  color: rgba(247,244,236,0.78); max-width: 820px;
}
.points { display: flex; gap: 10px; margin-top: 14px; }
.point {
  border: 1px solid rgba(240,180,41,0.45); border-radius: 999px;
  padding: 8px 16px; font-size: 16px; font-weight: 500; color: #f7f4ec;
}
